<template>
    <lightning-card title="Weather Dashboard" icon-name="custom:custom63">
        <div class="slds-p-around_medium">

            <!-- City Input -->
            <lightning-input type="text" label="Enter City" value={city} onchange={handleCityChange}>
            </lightning-input>

            <!-- Get Weather Button -->
            <lightning-button label="Get Weather" variant="brand" onclick={getWeather} class="slds-m-top_small"
                disabled={isLoading}>
            </lightning-button>

            <!-- Loading State -->
            <template if:true={isLoading}>
                <div class="slds-m-top_medium slds-align_absolute-center">
                    <lightning-spinner alternative-text="Fetching weather data" size="medium">
                    </lightning-spinner>
                </div>

                <p class="slds-text-align_center slds-m-top_small">
                    Fetching weather data...
                </p>
            </template>

            <!-- Result / Error State -->
            <template if:false={isLoading}>

                <!-- Weather Data -->
                <template if:true={weatherData}>
                    <div class="slds-m-top_medium">
                        <p>City: {weatherData.location.name}</p>
                        <p>Temperature: {weatherData.data.values.temperature} °C</p>
                        <p>Humidity: {weatherData.data.values.humidity}%</p>
                        <p>Wind Speed: {weatherData.data.values.windSpeed}</p>
                        <p>Pressure: {weatherData.data.values.pressureSurfaceLevel}</p>
                    </div>
                </template>

                <!-- Error -->
                <template if:true={error}>
                    <div class="slds-m-top_medium slds-text-color_error">
                        <p>{error}</p>
                    </div>
                </template>

            </template>

        </div>
    </lightning-card>
</template>
